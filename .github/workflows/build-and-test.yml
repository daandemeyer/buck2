name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

# A pull request's superseded run is cancelled; on `main` the run in flight
# finishes so that every push still gets a verdict (see build-with-buck2.yml).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # rust-cache keeps only the dependency artifacts between runs, so every run
  # compiles the workspace crates from scratch and incremental compilation only
  # costs time and disk.
  CARGO_INCREMENTAL: 0
  # Backtraces keep their file:line; nothing in CI attaches a debugger. The
  # `test` profile inherits this from `dev`.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  select_platforms:
    name: Select the platforms to test
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.select_platforms.outputs.platforms }}
    steps:
      - name: Select platforms
        id: select_platforms
        env:
          # Runner labels are repository (owner) specific, so the Meta larger runners
          # (16-core-ubuntu, macos-15-xlarge, windows-8-core) don't exist on forks and
          # jobs requesting them would sit queued forever waiting for a runner that
          # isn't available. Fall back to the standard GitHub-hosted runners there.
          LINUX_RUNNER: ${{ github.repository_owner == 'meta' && '16-core-ubuntu' || 'ubuntu-latest' }}
          MACOS_RUNNER: ${{ github.repository_owner == 'meta' && 'macos-15-xlarge' || 'macos-15' }}
          WINDOWS_RUNNER: ${{ github.repository_owner == 'meta' && 'windows-8-core' || 'windows-latest' }}
          # build_buck2.yml documents the repository variable BUCK2_RELEASE_TARGETS. When a
          # fork sets it, GitHub only queues jobs for the operating systems of the listed
          # targets. A fork without macOS or Windows runners can then still pass the run.
          RELEASE_TARGETS: ${{ vars.BUCK2_RELEASE_TARGETS }}
        run: |
          platforms=$(jq -nc --arg targets "$RELEASE_TARGETS" \
            --arg linux "$LINUX_RUNNER" --arg macos "$MACOS_RUNNER" --arg windows "$WINDOWS_RUNNER" '
            [
              {name: "linux", "runs-on": $linux, pattern: "-linux-"},
              {name: "macos", "runs-on": $macos, pattern: "-apple-darwin"},
              {name: "windows", "runs-on": $windows, pattern: "-windows-"}
            ]
            | map(select(.pattern as $p | $targets == "" or ($targets | contains($p))) | del(.pattern))
          ')
          echo "Testing: $(jq -r 'map(.name) | join(" ")' <<< "$platforms")"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  # Clippy and rustdoc check the crates; the tests build them. The two share no
  # artifacts, so they run as separate jobs for wall time.
  lint:
    name: lint (${{ matrix.name }})
    needs: select_platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select_platforms.outputs.platforms) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-lint
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run clippy
      run: python3 test.py --ci --git --lint-only
      shell: bash
    - name: Run rustdoc
      run: python3 test.py --ci --git --rustdoc-only
      shell: bash
  test:
    name: test (${{ matrix.name }})
    needs: select_platforms
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select_platforms.outputs.platforms) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-test
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run the tests
      run: python3 test.py --ci --git --test-only
      shell: bash
